  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-decoration:none}\na:hover{color:#a51820}\ninput:focus,select:focus,textarea:focus{outline:none;border-color:#D0212A!important}\ninput,select{font-family:'Archivo',sans-serif}\ninput:not([type=checkbox]):not([type=radio]):not([type=date]),select{-webkit-appearance:none;appearance:none}\ninput[type=checkbox]{-webkit-appearance:auto;appearance:auto}\n@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n@keyframes spin{to{transform:rotate(360deg)}}\n@keyframes qrpulse{0%,100%{opacity:1}50%{opacity:.6}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;width:100%;background:#ffffff;display:flex;flex-direction:column;align-items:center;padding:0 16px 32px\">\n<div style=\"width:100%;max-width:520px;display:flex;flex-direction:column;flex:1\">\n\n  <div style=\"display:flex;justify-content:center;padding:26px 0 2px\">\n    <img src=\"c17f6caa-a527-416c-95d5-10373e4f57eb\" alt=\"YENİ Parti\" style=\"width:158px;max-width:52%;height:auto;display:block\">\n  <\u002Fdiv>\n\n  <!-- 1 · GİRİŞ -->\n  <sc-if value=\"{{ isEntry }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;flex-direction:column;gap:18px;padding-top:12px;animation:fadeUp .35s ease both\">\n      <div style=\"display:flex;flex-direction:column;gap:11px;text-align:center\">\n        <h1 style=\"font-size:23px;font-weight:900;color:#111111;margin:0;line-height:1.3;text-wrap:balance\">Geleceği Birlikte İnşa Etmeye Var Mısın?<\u002Fh1>\n        <p style=\"font-size:15.5px;line-height:1.6;color:#3a3a3a;margin:0;text-wrap:pretty\">İşçinin alın terinden gencin hayallerine, emeklinin huzurundan çiftçinin bereketine… YENİ Parti; bu ülkenin üreten, emek veren ve yarınlara umutla bakan tüm insanlarının sesidir.<\u002Fp>\n        <p style=\"font-size:15.5px;line-height:1.6;color:#3a3a3a;margin:0;text-wrap:pretty\">Cumhuriyet değerlerimizden aldığımız güçle, daha adil ve aydınlık bir geleceği birlikte kuruyoruz. Sen yoksan bir eksiğiz!<\u002Fp>\n        <p style=\"font-size:16.5px;line-height:1.45;color:#D0212A;font-weight:800;margin:0;text-wrap:balance\">Aramıza Katıl, YENİ Bir Başlangıcın Parçası Ol!<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <label for=\"tcinput\" style=\"font-size:15px;font-weight:700;color:#111111\">T.C. Kimlik Numaranız<\u002Flabel>\n        <input id=\"tcinput\" type=\"text\" sc-camel-input-mode=\"numeric\" sc-camel-max-length=\"11\" placeholder=\"\" value=\"{{ tc }}\" sc-camel-on-change=\"{{ onTc }}\" style=\"width:100%;padding:15px 16px;font-size:20px;font-weight:600;text-align:center;letter-spacing:5px;border:2px solid #dddddd;border-radius:14px;color:#111111;transition:border-color .15s\">\n        <sc-if value=\"{{ tcError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:10px;align-items:flex-start;background:#fdecec;border:1px solid #f2b6ba;color:#a51820;padding:14px 16px;border-radius:12px;font-size:14.5px;line-height:1.5;font-weight:600\">\n            <span style=\"flex:none\">!<\u002Fspan><span>{{ tcError }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ doQuery }}\" disabled=\"{{ querying }}\" style=\"width:100%;padding:17px;background:#D0212A;color:#ffffff;border:none;border-radius:14px;font-family:'Archivo',sans-serif;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(208,33,42,.28);display:flex;align-items:center;justify-content:center;gap:12px\" style-hover=\"background:#b71b23\">{{ queryLabel }}<\u002Fbutton>\n        \n      <\u002Fdiv>\n\n          <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- 2 · ÇOK ADIMLI FORM -->\n  <sc-if value=\"{{ isForm }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-direction:column;gap:20px;padding-top:16px\">\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <button sc-camel-on-click=\"{{ back }}\" style=\"background:none;border:none;padding:8px 0;font-family:'Archivo',sans-serif;font-size:17px;font-weight:700;color:#D0212A;cursor:pointer\">← Geri<\u002Fbutton>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:700;color:#888888\">ADIM {{ stepNum }} / 5<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:6px\">\n        <div style=\"flex:1;height:6px;border-radius:3px;background:{{ bar1 }};transition:background .3s\"><\u002Fdiv>\n        <div style=\"flex:1;height:6px;border-radius:3px;background:{{ bar2 }};transition:background .3s\"><\u002Fdiv>\n        <div style=\"flex:1;height:6px;border-radius:3px;background:{{ bar3 }};transition:background .3s\"><\u002Fdiv>\n        <div style=\"flex:1;height:6px;border-radius:3px;background:{{ bar4 }};transition:background .3s\"><\u002Fdiv>\n        <div style=\"flex:1;height:6px;border-radius:3px;background:{{ bar5 }};transition:background .3s\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\">\n        <h2 style=\"font-size:22px;font-weight:900;color:#111111;margin:0;line-height:1.25\">{{ stepTitle }}<\u002Fh2>\n        <div style=\"font-size:14px;color:#888888;line-height:1.5\">{{ stepHint }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Adım 1: kimlik (otomatik dolu) -->\n      <sc-if value=\"{{ isS1blank }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;animation:fadeUp .3s ease both\">\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:16px;font-weight:700;color:#333333\"><span style=\"display:flex;align-items:center;gap:5px\">Ad <span style=\"color:#D0212A\">*<\u002Fspan><\u002Fspan>\n            <input type=\"text\" value=\"{{ mName }}\" sc-camel-on-change=\"{{ onMName }}\" placeholder=\"Adınız\" style=\"width:100%;padding:14px;font-size:16.5px;border:2px solid #dddddd;border-radius:12px\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:co steriyorum <span style=\"color:#D0212A\">*<\u002Fspan><\u002Fspan>\n                <span style=\"font-size:13.5px;color:#8a8a8a;line-height:1.5\">Kişisel verilerinizin 6698 sayılı KVKK kapsamında işlenmesini kabul edersiniz.<\u002Fspan>\n              <\u002Fspan>\n            <\u002Flabel>\n            <label style=\"display:flex;gap:14px;align-items:flex-start;cursor:pointer\">\n              <input type=\"checkbox\" checked=\"{{ declare }}\" sc-camel-on-change=\"{{ onDeclare }}\" style=\"width:24px;height:24px;flex:none;margin-top:2px;accent-color:#D0212A\">\n              <span style=\"display:flex;flex-direction:column;gap:4px\">\n                <span style=\"display:flex;align-items:center;gap:5px;font-size:15.5px;font-weight:700;color:#222222\">Bilgilerin doğruluğunu beyan ediyorum <span style=\"color:#D0212A\">*<\u002Fspan><\u002Fspan>\n                <span style=\"font-size:13.5px;color:#8a8a8a;line-height:1.5\">Formda belirttiğiniz tüm bilgilerin doğru ve eksiksiz olduğunu beyan edersiniz.<\u002Fspan>\n              <\u002Fspan>\n            <\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ formError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fdecec;border:1px solid #f2b6ba;color:#a51820;padding:14px 16px;border-radius:12px;font-size:14.5px;line-height:1.5;font-weight:600\">{{ formError }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <button sc-camel-on-click=\"{{ next }}\" style=\"width:100%;padding:20px;background:#D0212A;color:#ffffff;border:none;border-radius:14px;font-family:'Archivo',sans-serif;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(208,33,42,.24)\" style-hover=\"background:#b71b23\">{{ nextLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- 3 · SONUÇ -->\n  <sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:30px;text-align:center;animation:fadeUp .35s ease both\">\n      <div style=\"width:84px;height:84px;border-radius:50%;background:#D0212A;color:#ffffff;font-size:42px;font-weight:700;display:flex;align-items:center;justify-content:center\">✓<\u002Fdiv>\n      <h2 style=\"font-size:23px;font-weight:900;color:#111111;margin:0\">Başvurunuz Alındı<\u002Fh2>\n      <p style=\"font-size:16px;color:#555555;line-height:1.6;margin:0;text-wrap:pretty\">Başvurunuz {{ city }} il başkanlığımıza iletildi. Onaylandığında SMS ile bilgilendirileceksiniz.<\u002Fp>\n      <button sc-camel-on-click=\"{{ goCard }}\" style=\"width:100%;padding:19px;background:#111111;color:#ffffff;border:none;border-radius:14px;font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;cursor:pointer\">Dijital Üye Kartımı Gör<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ reset }}\" style=\"background:none;border:none;font-family:'Archivo',sans-serif;font-size:17px;font-weight:700;color:#888888;cursor:pointer;padding:6px\">Başa dön<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- 4 · ÜYE PANELİ + KART -->\n  <sc-if value=\"{{ isPanel }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-direction:column;gap:22px;padding-top:16px;animation:fadeUp .35s ease both\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\">\n        <div style=\"min-width:0\">\n          <div style=\"font-size:15px;color:#999999\">Hoş geldiniz<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:900;color:#111111;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ fullName }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ reset }}\" style=\"flex:none;background:none;border:2px solid #e2e2e2;border-radius:10px;padding:11px 16px;font-family:'Archivo',sans-serif;font-size:16px;font-weight:700;color:#666666;cursor:pointer\" style-hover=\"border-color:#D0212A;color:#D0212A\">Çıkış<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"background:linear-gradient(135deg,#D0212A 0%,#8f141b 100%);border-radius:20px;padding:24px;color:#ffffff;box-shadow:0 12px 30px rgba(208,33,42,.28);display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:12px\">\n          <div style=\"line-height:1\">\n            <div style=\"font-size:26px;font-weight:900;letter-spacing:1px\">YENİ<\u002Fdiv>\n            <div style=\"width:70px;height:2px;background:#ffffff;margin:6px 0\"><\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:700;letter-spacing:6px\">PARTİ<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:1px;background:rgba(255,255,255,.2);padding:7px 12px;border-radius:20px;flex:none\">DİJİTAL ÜYE KARTI<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:14px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n            <div style=\"font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ fullName }}<\u002Fdiv>\n            <div style=\"font-size:15px;opacity:.92\">Üye No: {{ memberNo }}<\u002Fdiv>\n            <div style=\"font-size:15px;opacity:.92\">{{ city }} · {{ job }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#ffffff;border-radius:10px;padding:7px;flex:none\">\n            <div style=\"width:80px;height:80px;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:1px;animation:qrpulse 3s ease-in-out infinite\">{{ qrCells }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px\">\n        <div style=\"border:2px solid #f0f0f0;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font-size:26px;font-weight:900;color:#D0212A\">Güncel<\u002Fdiv>\n          <div style=\"font-size:15px;color:#666666\">Aidat durumu<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:2px solid #f0f0f0;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font-size:26px;font-weight:900;color:#111111\">3<\u002Fdiv>\n          <div style=\"font-size:15px;color:#666666\">Yaklaşan etkinlik<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:17px;font-weight:900;color:#111111\">Duyurular<\u002Fdiv>\n        <sc-for list=\"{{ announcements }}\" as=\"a\" hint-placeholder-count=\"3\">\n          <div style=\"border-left:4px solid #D0212A;background:#fafafa;border-radius:0 12px 12px 0;padding:15px 17px;display:flex;flex-direction:column;gap:4px\">\n            <div style=\"font-size:17px;font-weight:800;color:#111111\">{{ a.title }}<\u002Fdiv>\n            <div style=\"font-size:16px;color:#666666;line-height:1.5\">{{ a.body }}<\u002Fdiv>\n            <div style=\"font-size:14px;color:#b0b0b0\">{{ a.date }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"margin-top:auto;padding-top:28px;text-align:center;font-size:12px;color:#c2c2c2;line-height:1.6\">YENİ Parti Dijital Üyelik Platformu · Tasarım aşaması<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'entry', step: 1, tc: '', tcError: '', querying: false,\n    nvi: null, autoFilled: false, loc: null,\n    mName: '', mSurname: '', mDob: '', mGender: '', mBirthPlace: '', sugOpen: false, sugField: '',\n    phone: '', emailUser: '', emailDomain: 'gmail.com', emailCustom: '', city: '', district: '', hood: '', address: '', dob: '', dobD: '', dobM: '', dobY: '',\n    edu: '', program: '', job: '', workStatus: '', sector: '',\n    wasMember: false, prevParty: '', wantRole: false, roles: [],\n    consent: false, declare: false, formError: ''\n  };\n\n  // Test veritabanı — gerçek bağlantı buraya gelecek (tek fonksiyon: lookupTc)\n  db = {\n    '55555555555': { name: 'Fatih', surname: 'Karaosmanoğlu', dob: '29.04.1981', gender: 'Erkek', birthPlace: 'İstanbul',\n      edu: 'Lisans', program: 'Kamu Yönetimi', job: 'Bilişim', workStatus: 'Ücretli çalışıyor', sector: 'Özel sektör', city: 'İstanbul', district: 'Küçükçekmece', hood: 'Sultan Murat Mah.', address: 'Sultan Murat Mah. örnek adres',\n      phone: '0505 553 04 06', email: 'fatih.karaosmanoglu@gmail.com',\n      wasMember: true, prevParty: 'CHP', wantRole: true, member: false }\n  };\n\n  provinces = ['Adana','Adıyaman','Afyonkarahisar','Ağrı','Aksaray','Amasya','Ankara','Antalya','Ardahan','Artvin','Aydın','Balıkesir','Bartın','Batman','Bayburt','Bilecik','Bingöl','Bitlis','Bolu','Burdur','Bursa','Çanakkale','Çankırı','Çorum','Denizli','Diyarbakır','Düzce','Edirne','Elazığ','Erzincan','Erzurum','Eskişehir','Gaziantep','Giresun','Gümüşhane','Hakkâri','Hatay','Iğdır','Isparta','İstanbul','İzmir','Kahramanmaraş','Karabük','Karaman','Kars','Kastamonu','Kayseri','Kırıkkale','Kırklareli','Kırşehir','Kilis','Kocaeli','Konya','Kütahya','Malatya','Manisa','Mardin','Mersin','Muğla','Muş','Nevşehir','Niğde','Ordu','Osmaniye','Rize','Sakarya','Samsun','Siirt','Sinop','Sivas','Şanlıurfa','Şırnak','Tekirdağ','Tokat','Trabzon','Tunceli','Uşak','Van','Yalova','Yozgat','Zonguldak'];\n\n  provinceList() {\n    const loc = this.state.loc;\n    if (loc) return Object.keys(loc);\n    return this.provinces;\n  }\n\n  componentDidMount() {\n    fetch((window.__resources && window.__resources.trLoc) || 'tr-locations.json').then(r => r.json()).then(loc => this.setState({ loc: loc })).catch(() => {});\n  }\n\n  mailDomains = ['gmail.com', 'hotmail.com', 'outlook.com', 'yahoo.com', 'icloud.com', 'yandex.com', 'windowslive.com', 'mynet.com'];\n\n  partyOptions = ['CHP', 'AK Parti', 'HDP/DEM Parti', 'MHP', 'İYİ Parti', 'Saadet Partisi', 'DEVA Partisi', 'GELECEK Partisi', 'TİP', 'DP', 'BBP', 'Yeniden Refah', 'Zafer Partisi', 'Diğer'];\n  roleOptions = ['Seçimlerde görev almak isterim', 'Parti komisyonlarında görev almak isterim', 'Parti saha çalışmalarında görev almak isterim'];\n\n  eduOptions = ['Okuryazar değil', 'İlkokul', 'Ortaokul', 'Lise', 'Ön Lisans', 'Lisans', 'Yüksek Lisans', 'Doktora'];\n  workOptions = ['Ücretli çalışıyor', 'Kendi işinde çalışıyor', 'İş arıyor', 'Emekli', 'Öğrenci', 'Ev işleriyle ilgileniyor', 'Çalışamaz durumda'];\n  sectorOptions = ['Kamu', 'Özel sektör', 'Tarım / Hayvancılık', 'Sanayi / İmalat', 'Ticaret / Perakende', 'Eğitim', 'Sağlık', 'İnşaat', 'Turizm', 'Ulaştırma / Lojistik', 'Finans', 'Bilişim / Teknoloji', 'Medya / Kültür-Sanat', 'Sivil toplum', 'Diğer'];\n\n  validTc(v) {\n    if (!/^[1-9][0-9]{10}$/.test(v)) return false;\n    const d = v.split('').map(Number);\n    const odd = d[0] + d[2] + d[4] + d[6] + d[8];\n    const even = d[1] + d[3] + d[5] + d[7];\n    if ((odd * 7 - even) % 10 !== d[9]) return false;\n    return d.slice(0, 10).reduce((a, b) => a + b, 0) % 10 === d[10];\n  }\n\n  query = () => {\n    const tc = this.state.tc.trim();\n    if (!/^\\d{11}$/.test(tc)) return this.setState({ tcError: 'T.C. kimlik numarasını yanlış girdiniz. Lütfen 11 haneli numaranızı giriniz.' });\n    this.setState({ querying: true, tcError: '' });\n    setTimeout(() => {\n      // TASARIM AŞAMASI: 11 haneli her numara geçerli kabul edilir.\n      // Sadece 55555555555 veritabanında kayıtlı gibi davranır (form dolu gelir).\n      const rec = this.db[tc] || { name: '', surname: '', dob: '', gender: '', birthPlace: '',\n        edu: '', program: '', job: '', workStatus: '', sector: '',\n    wasMember: false, prevParty: '', wantRole: false, roles: [], city: '', district: '', member: false, blank: true };\n      if (rec.member) return this.setState(
